<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>LOGIN</title>
</head>

<body>
    <div class="div_image">
        <div class="icones"><img src="" alt=""><img src="" alt=""><img src="" alt=""></div>
        <h1 class="login_titulo">Pequenas ações podem economizar muita energia.</h1>
        <p class="login_subtittulo">Junte-se à plataforma InfoLight FOA e aprenda a fazer a diferença no consumo
            consciente de energia.</p>
    </div>
    <div class="div_form">
        <form action="" class="formulario">
            <div class="div_login">
                <div class="caixa">
                    <h1 class="titulo_caixa">Log-in</h1>
                    <p class="subtitulo_caixa">Acesse a plataforma InfoLight</p>
                    <p class="titulo_email">E-mail</p>
                    <div class="div_input">
                        <input type="email" class="input_email">
                    </div>

                    <p class="titulo_senha">Senha</p>
                    <div class="div_input_pass">
                        <input type="password" class="input_senha">
                    </div>
                    <button class="botao_entra">Entra</button>
                </div>
            </div>
        </form>
        <a href="">criar conta</a>
    </div>
</body>

</html>
