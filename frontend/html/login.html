<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>LOGIN</title>
</head>

<body>
    <div class="div_image">
        <div class="icones"><img src="" alt=""><img src="" alt=""><img src="" alt=""></div>
        <h1 class="login_titulo">Pequenas ações podem economizar muita energia.</h1>
        <p class="login_subtittulo">Junte-se à plataforma InfoLight FOA e aprenda a fazer a diferença no consumo
            consciente de energia.</p>
    </div>
    <div class="div_form">
        <div class="div_login">
            <div class="caixa">
                <div class="text">
                    <h1 class="titulo_caixa">Log-in</h1>
                    <p class="subtitulo_caixa">Acesse a plataforma InfoLight</p>
                </div>
                <div>
                    <p>E-mail:</p>
                    <div class="caixinha_mail">
                        <input type="email" name="email" id="input_email">
                    </div>
                </div>
                <div>
                    <p>Senha:</p>
                    <div class="caixinha_mail">
                        <input type="password" name="password" id="input_password">
                    </div>
                </div>
                <button class="botao" id="botao_cadastro">Entrar</button>

                <a href="/cadastro">Criar Conta</a>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/js/formActionLogin.js"></script>
</body>

</html>
